<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive website -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website title -->
    <title>Card Layout</title>

    <!-- Connecting CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Main container -->
    <div class="container">

        <!-- Card 1 -->
        <div class="card">

            <!-- Image -->
            <img src="https://picsum.photos/300/200" alt="Random Image">

            <!-- Card heading -->
            <h2>Web Development</h2>

            <!-- Card paragraph -->
            <p>
                Learn HTML, CSS and JavaScript with beginner friendly projects.
            </p>

            <!-- Button -->
            <button>Read More</button>

        </div>

        <!-- Card 2 -->
        <div class="card">

            <!-- Image -->
            <img src="https://picsum.photos/301/200" alt="Random Image">

            <!-- Heading -->
            <h2>UI Design</h2>

            <!-- Paragraph -->
            <p>
                Create beautiful website designs using simple CSS concepts.
            </p>

            <!-- Button -->
            <button>Explore</button>

        </div>

    </div>

</body>

</html>
