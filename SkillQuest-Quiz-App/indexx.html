<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillQuest</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div id="start-screen">
      <h1>🧠 SkillQuest</h1>
      <p>Test Your Knowledge</p>

      <button id="start-btn">
        Start Quiz
      </button>
    </div>

    <div id="quiz-screen" class="hide">

      <div class="top-bar">

        <div class="score-box">
          Score: <span id="score">0</span>
        </div>

        <div class="timer-box">
          ⏳ <span id="timer">15</span>s
        </div>

      </div>

      <div class="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <p id="question-count"></p>

      <h2 id="question"></h2>

      <div id="answers"></div>

      <button id="next-btn">
        Next Question →
      </button>

    </div>

    <div id="result-screen" class="hide">

      <h1>🏆 Quiz Complete</h1>

      <h2 id="final-score"></h2>

      <h3 id="rank"></h3>

      <button onclick="location.reload()">
        Play Again
      </button>

    </div>

  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>

</body>

</html>
