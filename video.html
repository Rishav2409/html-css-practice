<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>Video in HTML</title>

    <!-- Internal CSS -->
    <style>

        /* Body Styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        /* Video Styling */
        video {
            width: 70%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

    </style>

</head>

<body>

    <!-- Video Player -->
    <video src="assets/video.mp4"
           autoplay
           muted
           controls>
    </video>

</body>
</html>
